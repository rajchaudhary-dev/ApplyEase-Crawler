name: Sarkari Result Recruitment Sync Cron

on:
  schedule:
    # Runs every 6 hours (at minute 0 past every 6th hour)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-vacancies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Sarkari Crawler & PDF Downloader
        env:
          SUPABASE_URL_RAW: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY_RAW: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CLEAN_URL=$(echo "$SUPABASE_URL_RAW" | tr -d '[:space:]')
          CLEAN_KEY=$(echo "$SUPABASE_KEY_RAW" | tr -d '[:space:]')
          python sarkari_crawler.py --limit 15 --deep --download-pdfs --supabase --supabase-url "$CLEAN_URL" --supabase-key "$CLEAN_KEY" --output-json vacancies.json
